app:
  name: "Digital Islamic Library AI"
  log_level: "INFO"

models:
  provider: "gemini" # Default provider: "gemini" or "nvidia"
  gemini:
    api_key_env: "GEMINI_API_KEY"
    llm_model: "gemini-3.5-flash-lite"
    embedding_model: "gemini-embedding-2-preview"
  nvidia:
    api_key_env: "NVIDIA_API_KEY"
    base_url: "https://integrate.api.nvidia.com/v1"
    llm_model: "nvidia/llama-3.1-nemotron-70b-instruct"
    embedding_model: "nvidia/nv-embedqa-e5-v5"
  embedding:
    model_name: "gemini-embedding-2-preview"
    output_dimensionality: 768
    api_key_env: "GEMINI_API_KEY"
  llm:
    model_name: "gemini-3.5-flash-lite"
    api_key_env: "GEMINI_API_KEY"
    temperature: 0.1
    max_output_tokens: 2048
  cross_encoder:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

pinecone:
  api_key_env: "PINECONE_API_KEY"
  index_name: "advanced-rag-index"
  namespace: "default"
  cloud: "aws"
  region: "us-east-1"

chunking:
  chunk_size: 400
  chunk_overlap: 60
  separators: ["\n## ", "\n### ", "\n## ", "\n# ", "\n\n", "\n", ". ", " "]

retrieval:
  dense_top_k: 30
  sparse_top_k: 30
  rrf_k: 60
  fusion_top_k: 50
  rerank_top_k: 5

paths:
  bm25_index: "./data/bm25_index.pkl"
  documents_dir: "./data/pdfs"
